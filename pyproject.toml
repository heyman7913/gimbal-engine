[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-motion-flow"
version = "0.5.0"
description = "GPU-accelerated video stabilization with COLMAP trajectory export"
authors = [
    {name = "Himansh Chitkara", email = "himanshchitkara77@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = [
    "cuda", "video", "stabilization", "gpu", "computer-vision",
    "optical-flow", "lucas-kanade", "ransac", "structure-from-motion",
    "gaussian-splatting", "colmap", "camera-pose",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Environment :: GPU :: NVIDIA CUDA",
]

dependencies = [
    "numpy>=1.22,<3.0",
    "opencv-python>=4.8",
    "click>=8.0",
    "rich>=13.0",
    # CuPy must be installed separately - cupy-cuda12x or cupy-cuda13x both work. Match nvcc --version
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.scripts]
cuda-motion-flow = "cuda_motion_flow.cli:main"

[project.urls]
Homepage = "https://github.com/heyman7913/cuda-motion-flow"
Repository = "https://github.com/heyman7913/cuda-motion-flow"
Issues = "https://github.com/heyman7913/cuda-motion-flow/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true