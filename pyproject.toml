[build-system]
requires = ["setuptools>=64", "wheel", "torch>=2.7"]
build-backend = "setuptools.build_meta"

[project]
name = "gimbal_engine"
version = "2.1.1"
description = "GPU-accelerated video stabilization with a deep-learning homography model and a custom fused CUDA autograd kernel."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Himansh Chitkara" }]
keywords = [
    "cuda",
    "gpu",
    "pytorch",
    "deep-learning",
    "machine-learning",
    "computer-vision",
    "video-stabilization",
    "video-processing",
    "homography",
    "optical-flow",
    "cuda-kernels",
    "cuda-extension",
    "image-processing",
    "cli-tool",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: GPU",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# torch and cupy must match the host CUDA / GPU architecture. They are installed
# explicitly inside the container (see Dockerfile) from the matching wheel index.
# They are listed here so the metadata is complete, but a plain `pip install` on an
# arbitrary machine is not expected to resolve a Blackwell-compatible build.
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "rich>=13.7",
    "rich-click>=1.8",
    "click>=8.1",
    "matplotlib>=3.8",
    "torch>=2.7",
    "cupy-cuda12x>=13.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
gimbal = "gimbal.cli:main"

[project.urls]
Homepage = "https://github.com/heyman7913/gimbal-engine"
Repository = "https://github.com/heyman7913/gimbal-engine"
Documentation = "https://github.com/heyman7913/gimbal-engine#readme"
Issues = "https://github.com/heyman7913/gimbal-engine/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["gimbal*"]

[tool.setuptools.package-data]
gimbal = ["weights/*.pt", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["gimbal", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["gimbal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "cuda: test requires a CUDA device and is skipped otherwise",
]
filterwarnings = [
    # CuPy 14 deprecated ExternalStream; its replacement has an incompatible signature here
    "ignore:ExternalStream is deprecated:DeprecationWarning",
]
