[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-motion-flow"
version = "0.1.0"
description = "GPU-accelerated video stabilization using CUDA"
authors = [
    {name = "Himansh Chitkara", email = "himanshchitkara77@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["cuda", "video", "stabilization", "gpu", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "numpy>=1.22,<3.0",
    "cupy-cuda12x>=13.0",
    "opencv-python>=4.8",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "black>=26.0",
    "flake8>=7.0",
    "mypy>=1.0",
]

[project.scripts]
cuda-motion-flow = "cuda_motion_flow.cli:main"

[project.urls]
Homepage = "https://github.com/heyman7913/cuda-motion-flow"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false